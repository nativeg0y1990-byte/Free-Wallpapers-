<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Phone Wallpapers</title>
    <style>
        /* CSS STYLING & CORE LAYOUT */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: #1a1a1a; margin-bottom: 8px; }
        
        /* Category Navigation Filter */
        .categories { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; border: none; background-color: #fff; color: #555; border-radius: 20px; cursor: pointer; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: all 0.2s; }
        .tab.active, .tab:hover { background-color: #007bff; color: #fff; }
        
        /* Wallpaper Discovery Grid */
        .wallpaper-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s; cursor: pointer; display: block; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 360px; object-fit: cover; display: block; }
        .card-info { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 14px; font-weight: 600; }
        .preview-btn { background-color: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        
        /* Smartphone Simulation Preview Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 1000; }
        .phone-frame { width: 300px; height: 600px; border: 10px solid #222; border-radius: 40px; position: relative; background-size: cover; background-position: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 30px 20px; color: white; text-align: center; }
        .phone-time { font-size: 42px; font-weight: 300; margin-top: 20px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .close-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.3); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>Mobile Wallpapers</h1>
        <p>Click any design to preview it live on a phone mock screen</p>
    </header>

    <nav class="categories">
        <button class="tab active" onclick="filterCategory('all')">All</button>
        <button class="tab" onclick="filterCategory('minimalist')">Minimalist</button>
        <button class="tab" onclick="filterCategory('nature')">Nature</button>
        <button class="tab" onclick="filterCategory('abstract')">Abstract</button>
    </nav>

        <main class="wallpaper-grid">
        
        <!-- Wallpaper Item 1 -->
        <div class="card" data-category="minimalist" onclick="openPreview('PASTE_YOUR_HIGH_RES_LINK_HERE')">
            <img src="PASTE_YOUR_THUMBNAIL_LINK_HERE" alt="Your Wallpaper Title">
            <div class="card-info">
                <span class="card-title">Your Wallpaper Title</span>
                <button class="preview-btn">Preview</button>
            </div>
        </div>

        <!-- Repeat the block above for every new wallpaper you want to add! -->

    </main>


    <div id="previewModal" class="modal" onclick="closePreview()">
        <button class="close-btn" onclick="closePreview()">&times;</button>
        <div id="phoneMock" class="phone-frame">
            <div class="phone-time">09:41</div>
            <div style="font-size: 14px; text-shadow: 0 1px 5px rgba(0,0,0,0.5);">Swipe up to open</div>
        </div>
    </div>

    <script>
        /* INTERACTIVE JAVASCRIPT LOGIC */
        function filterCategory(category) {
            // Update Active Navigation Tab Style
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Filter Layout Display Grid Elements
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function openPreview(imgUrl) {
            document.getElementById('phoneMock').style.backgroundImage = `url('${imgUrl}')`;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('previewModal').style.display = 'none';
        }
    </script>
</body>
</html>
